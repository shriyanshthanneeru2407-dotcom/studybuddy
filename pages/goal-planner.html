<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal Planner — StudyBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layouts.css">
  <script src="../js/core/theme.js"></script>
  <style>
    /* Specific Goal card features */
    .goals-grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-6);
    }
    .goal-card-wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .goal-priority-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--sp-3);
    }
    .goal-title-field {
      font-size: var(--text-base);
      font-weight: var(--fw-bold);
      color: var(--text-primary);
      margin-bottom: var(--sp-2);
    }
    .goal-description {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin-bottom: var(--sp-4);
      flex: 1;
    }
    .goal-date-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-bottom: var(--sp-4);
    }
    .goal-date-row svg {
      width: 14px;
      height: 14px;
    }
    .goal-actions-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border-color-light);
      padding-top: var(--sp-3);
      margin-top: var(--sp-2);
    }
    @media (max-width: 900px) {
      .goals-grid-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar" aria-label="Main Navigation">
      <a href="../index.html" class="sidebar-brand">
        <div class="sidebar-logo">S</div>
        <span class="sidebar-brand-name">Study<span>Buddy</span></span>
      </a>
      
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar collapse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- Injected dynamically -->
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user" id="userDropdownBtn" aria-haspopup="true">
          <div class="avatar avatar-sm" data-user-initials>--</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" data-user-name>Loading...</div>
            <div class="sidebar-user-role" data-user-role>User</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
      
      <!-- TOP NAV -->
      <header class="topnav" id="topnav">
        <div class="topnav-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open navigation drawer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="topnav-title">Goal Planner</div>
        </div>

        <div class="topnav-right">
          <button class="theme-toggle" aria-label="Toggle theme"></button>
          <div class="dropdown" id="userDropdown">
            <div class="dropdown-menu" style="right:0;">
              <a href="settings.html" class="dropdown-item">Settings</a>
              <a href="help-centre.html" class="dropdown-item">Help Centre</a>
              <div class="dropdown-divider"></div>
              <button class="dropdown-item danger" data-action="logout">Sign Out</button>
            </div>
          </div>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="page-content">
        
        <div class="page-header">
          <div>
            <nav class="breadcrumb" aria-label="Breadcrumbs" id="autoBreadcrumb"></nav>
            <h1 class="page-heading mt-2">Personal Academic Goals</h1>
            <p class="page-subheading">Track your progress, set priorities, and keep up with milestones.</p>
          </div>
          <div>
            <button class="btn btn-primary" id="addGoalBtn" aria-haspopup="dialog">
              <span>🎯 Add New Goal</span>
            </button>
          </div>
        </div>

        <!-- SEARCH AND FILTER CONTROLS -->
        <div class="card card-sm mb-6" style="background:var(--bg-surface);">
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
            <div class="search-input" style="flex:1;min-width:240px;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="goalSearch" placeholder="Search goals...">
            </div>
            
            <div style="min-width:140px;">
              <select id="priorityFilter" class="form-select" style="min-height:36px;height:36px;padding-top:4px;padding-bottom:4px;">
                <option value="all">All Priorities</option>
                <option value="High">High Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="Low">Low Priority</option>
              </select>
            </div>

            <div style="min-width:140px;">
              <select id="statusFilter" class="form-select" style="min-height:36px;height:36px;padding-top:4px;padding-bottom:4px;">
                <option value="all">All Statuses</option>
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>
        </div>

        <!-- GOALS GRID -->
        <div class="goals-grid-container animate-fade-in" id="goalsGrid">
          <!-- Rendered dynamically -->
        </div>

      </main>
    </div>

  </div>

  <!-- ADD/EDIT GOAL MODAL -->
  <div class="modal-overlay" id="goalModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" style="max-width:440px;">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add Academic Goal</h2>
        <button class="btn-ghost" id="closeModalBtn" aria-label="Close modal" style="padding:4px;border-radius:50%;display:flex;align-items:center;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="goalForm" novalidate>
        <div class="modal-body" style="display:flex;flex-direction:column;gap:16px;">
          <input type="hidden" id="goalIndex">
          
          <!-- Title -->
          <div class="form-group">
            <label for="goalTitle" class="form-label">Goal Title<span class="required">*</span></label>
            <input type="text" id="goalTitle" class="form-input" placeholder="e.g. Master Trigonometry" required>
            <span class="form-error" id="titleError"></span>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label for="goalDesc" class="form-label">Description</label>
            <textarea id="goalDesc" class="form-textarea" placeholder="e.g. Complete chapter exercises and practice previous papers..." style="min-height:80px;"></textarea>
          </div>

          <div class="grid grid-2 gap-4">
            <!-- Priority -->
            <div class="form-group">
              <label for="goalPriority" class="form-label">Priority</label>
              <select id="goalPriority" class="form-select">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <!-- Status -->
            <div class="form-group">
              <label for="goalStatus" class="form-label">Status</label>
              <select id="goalStatus" class="form-select">
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>

          <div class="grid grid-2 gap-4">
            <!-- Completion % -->
            <div class="form-group">
              <label for="goalProgress" class="form-label">Progress (%)</label>
              <input type="number" id="goalProgress" class="form-input" value="0" min="0" max="100">
            </div>

            <!-- Deadline -->
            <div class="form-group">
              <label for="goalDeadline" class="form-label">Deadline</label>
              <input type="date" id="goalDeadline" class="form-input">
            </div>
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveGoalBtn">Save Goal</button>
        </div>
      </form>
    </div>
  </div>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <script src="../js/core/auth.js"></script>
  <script src="../js/components/nav.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/pages/goal-planner.js"></script>
</body>
</html>
